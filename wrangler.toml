# Cloudflare Pages config. Build settings for the dashboard / CI:
#   Build command:       npm run build
#   Build output dir:    dist
#   Node version:        20
name = "couponanddeals"
pages_build_output_dir = "dist"

# Click analytics for the /go/[slug] redirect function (free tier).
# Query: Cloudflare dashboard → Analytics Engine → coupon_clicks.
[[analytics_engine_datasets]]
binding = "CLICKS"
dataset = "coupon_clicks"

# Email capture for the newsletter form (functions/api/subscribe.js).
# To activate: dashboard → Storage & Databases → KV → Create namespace
# (e.g. "coupon-subscribers"), then uncomment and paste its id:
# [[kv_namespaces]]
# binding = "SUBSCRIBERS"
# id = "<paste-namespace-id>"
